<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLOOM COLLEGE - Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>
/* ======== CSS STYLES ======== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(120deg, #f0f4f8, #d9e8ff);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #333;
  min-height: 100vh;
}

.container {
  background-color: #ffffff;
  padding: 40px;
  margin: 50px auto;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-width: 750px;
  transition: all 0.3s ease;
}

.container:hover {
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
}

h2 {
  text-align: center;
  font-weight: 800;
  color: #002855;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.form-label {
  font-weight: 600;
  color: #003366;
}

.form-control,
.form-select {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.95rem;
  transition: 0.3s;
}

.form-control:focus,
.form-select:focus {
  border-color: #007bff;
  box-shadow: 0 0 6px rgba(0,123,255,0.3);
}

/* Image Upload */
.image-preview {
  width: 150px;
  height: 150px;
  border: 2px solid #ccc;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 10px auto;
  background-color: #f0f0f0;
}

#previewImg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.btn {
  width: 120px;
  font-weight: 600;
  border-radius: 8px;
  padding: 8px 0;
  transition: all 0.3s ease;
}

.btn-primary {
  background-color: #007bff;
  border: none;
}

.btn-primary:hover {
  background-color: #0056b3;
  transform: translateY(-2px);
}

.btn-outline-secondary {
  border: 1px solid #6c757d;
  color: #6c757d;
}

.btn-outline-secondary:hover {
  background-color: #6c757d;
  color: #fff;
  transform: translateY(-2px);
}

.modal-content {
  border-radius: 10px;
  border: none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.modal-header {
  border-bottom: none;
  border-radius: 10px 10px 0 0;
}

.modal-body {
  font-size: 1rem;
  color: #333;
  text-align: center;
}

.modal-footer {
  border-top: none;
}

@media (max-width: 576px) {
  .container {
    padding: 25px 20px;
  }
  h2 {
    font-size: 1.5rem;
  }
  .btn {
    width: 100px;
    font-size: 0.9rem;
  }
  .image-preview {
    width: 120px;
    height: 120px;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="form-container">
    <h2>BLOOM COLLEGE</h2>
    <h5 class="text-center mb-4 text-primary">Student Registration Form</h5>

    <form id="registrationForm">
      <!-- Image Upload -->
      <div class="image-upload-section text-center">
        <label for="studentImage" class="form-label fw-semibold text-dark d-block mb-2">Profile Image</label>
        <div class="image-preview mx-auto mb-2" id="imagePreview">
          <img id="previewImg" src="" alt="Preview" />
        </div>
        <input class="form-control" type="file" id="studentImage" accept="image/*" onchange="previewImage(event)" />
        <small class="text-secondary d-block mt-1">(less than 5 MB)</small>
      </div>

      <!-- Name Fields -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Name</label>
        <input type="text" id="studentName" class="form-control" placeholder="Full name" onchange="toCaps(this)" />
      </div>

      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Father’s Name</label>
        <input type="text" id="fatherName" class="form-control" placeholder="Father's name" onchange="toCaps(this)" />
      </div>

      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Mother’s Name</label>
        <input type="text" id="motherName" class="form-control" placeholder="Mother's name" onchange="toCaps(this)" />
      </div>

      <!-- Gender -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Gender</label>
        <div>
          <input type="radio" id="male" name="gender" value="Male" /> <label for="male" class="me-3">Male</label>
          <input type="radio" id="female" name="gender" value="Female" /> <label for="female">Female</label>
        </div>
      </div>

      <!-- Date of Birth -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Date of Birth</label>
        <input type="date" class="form-control" id="dob" />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="email@xyz.com"
               onfocus="onEmailFocus()" onblur="onEmailBlur(this)" />
      </div>

      <!-- Level -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Level</label>
        <select class="form-select">
          <option selected disabled>Select level</option>
          <option>Diploma</option>
          <option>Bachelor</option>
          <option>Master</option>
          <option>PhD</option>
        </select>
      </div>

      <!-- Department -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Department</label>
        <select class="form-select">
          <option selected disabled>Select department</option>
          <option>Computer Engineering</option>
          <option>Software Engineering</option>
          <option>Information Technology</option>
          <option>Cybersecurity</option>
        </select>
      </div>

      <!-- Telephone -->
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Tel/Mobile</label>
        <input type="tel" class="form-control" placeholder="01x-xxx xxxx" />
      </div>

      <!-- Address -->
      <h5 class="mt-4 text-primary">Address</h5>
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">State</label>
        <input type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">City</label>
        <input type="text" class="form-control" />
      </div>
      <div class="mb-3">
        <label class="form-label text-dark fw-semibold">Postcode</label>
        <input type="text" class="form-control" />
      </div>

      <div class="text-center mt-4">
        <button type="button" class="btn btn-primary btn-custom" onclick="submitForm()">Register</button>
        <button type="reset" class="btn btn-outline-secondary btn-custom">Reset</button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-3">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Registration Complete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        🎓 Your details have been recorded.<br />
        Welcome to <strong>HABART COLLEGE</strong>.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ======== JAVASCRIPT SECTION ======== -->
<script>
// (1) Preview selected profile image
function previewImage(event) {
  const reader = new FileReader();
  reader.onload = function() {
    const previewImg = document.getElementById("previewImg");
    previewImg.src = reader.result;
  };
  reader.readAsDataURL(event.target.files[0]);
}

// (2) onBlur for email field
function onEmailBlur(element) {
  element.style.backgroundColor = "";
  element.placeholder = "email@xyz.com";
}

// (3) onFocus for email field
function onEmailFocus() {
  const emailField = document.getElementById("email");
  emailField.style.backgroundColor = "#fff3cd"; // light yellow background
  emailField.placeholder = "Please enter your email carefully...";
}

// (4) onChange for name fields - change to CAPS
function toCaps(inputField) {
  inputField.value = inputField.value.toUpperCase();
}

// (5) Submit form using Bootstrap Modal
function submitForm() {
  const myModal = new bootstrap.Modal(document.getElementById("successModal"));
  myModal.show();
}
</script>
</body>
</html>
